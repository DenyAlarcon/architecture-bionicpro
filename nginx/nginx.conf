proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports_cache:10m max_size=256m inactive=30m use_temp_path=off;

server {
    listen 80;
    server_name _;

    location /reports/ {
        proxy_pass http://minio:9000/reports/;
        proxy_cache reports_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 30s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
    }
}
